version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: audit-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: property_audit
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p123456"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  backend:
    build: ./backend
    container_name: audit-backend
    restart: always
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "4", "--limit-concurrency", "50"]
    expose:
      - "8000"
    volumes:
      - ./backend/storage:/app/storage
      - ./backend/app:/app/app
    environment:
      - STORAGE_DIR=/app/storage
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=123456
      - MYSQL_DATABASE=property_audit
      - TZ=Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: audit-frontend
    restart: always
    environment:
      - TZ=Asia/Shanghai
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  mysql_data:
    driver: local